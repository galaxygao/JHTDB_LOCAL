# Pitt CRC, full 1024^3 RAM FFT cache. Recommended allocation: 32 CPUs / 160G / 12h.
# Set thread/cache environment variables as documented in docs/linux_crc_run.md.
dataset: isotropic1024coarse
variable: velocity
grid_shape: [1024, 1024, 1024]
domain_length: 6.283185307179586
stored_time_step: 0.002
platform:
  state_root: /ix/lfang/persistent/state
  run_root: /vast/lfang/xig134/JHTDB_CRC/runs
  result_root: /ix/lfang/xig134/JHTDB_CRC/results
auth:
  token_file: ${HOME}/.secrets/jhtdb_token
jhtdb:
  request_shape: [256, 256, 128]  # 96 MiB velocity payload; serial requests.
  tile_shape: [128, 128, 128]    # Preserve existing cache/checksum schema.
  retries: 3
  backoff_seconds: 2.0
  request_cooldown_seconds: 0.25
storage:
  compression_level: 3
  compression_threads: 4
  persistent_safety_reserve_gib: 32
  scratch_safety_reserve_gib: 32
validation:
  divergence_relative_rms_max: 1.0e-4
  divergence_relative_max_max: 1.0e-3
  energy_identity_relative_rms_max: 1.0e-4
  s_bar_vs_pi_net_max: 1.0e-2
  weak_asymmetry_closure_relative_max: 1.0e-12
physics:
  sigma_grid: [10, 15, 30, 55, 75]
  filter_type: smooth_sharp
  sharp_edge_width_fraction: 0.1171875
  fft_cache_mode: memory
  fft_workers: 24
  fft_slab_width: 16            # 64 MiB scalar input slab; full transform axes.
  cleanup_scratch_on_success: true
