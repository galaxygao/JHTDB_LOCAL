# JHTDB 数据源。当前实现只接受 isotropic1024coarse 的 velocity。
dataset: isotropic1024coarse
variable: velocity

# 完整周期域：[0, 2*pi)^3，生产网格必须为 1024^3。
grid_shape: [1024, 1024, 1024]  # 坐标顺序为 [x, y, z]
domain_length: 6.283185307179586
stored_time_step: 0.002          # physical_time=(time_index-1)*stored_time_step

platform:
  # state：catalog、输入缓存、manifest、QA 与锁。
  state_root: C:/Xingqun_Gao/persistent/state
  # run：FFT/memmap 临时工作区；成功后可自动清理。
  run_root: C:/Xingqun_Gao/persistent/runs
  # result：带 COMPLETE 的正式、可被 GUI 发现的结果。
  result_root: C:/Xingqun_Gao/persistent/results

auth:
  # 可被环境变量 JHTDB_TOKEN 覆盖。文件内容应只有一行 token。
  token_file: C:/Xingqun_Gao/persistent/.secrets/jhtdb_token

jhtdb:
  # getCutout 请求大小；原始 payload 必须 <=100 MiB，并整除 grid_shape。
  request_shape: [256, 256, 128]
  # 本地 checksum tile；当前存储格式固定要求 128^3。
  tile_shape: [128, 128, 128]
  # 单个请求的总尝试次数、指数退避基数和成功请求间隔（秒）。
  retries: 3
  backoff_seconds: 2.0
  request_cooldown_seconds: 0.25

storage:
  # Blosc 压缩等级 0..9 和压缩线程数。
  compression_level: 3
  compression_threads: 8
  # 写正式结果或临时工作区前必须额外保留的磁盘空间（GiB）。
  persistent_safety_reserve_gib: 24
  scratch_safety_reserve_gib: 24

validation:
  # 原始/滤波速度散度：RMS(div u)/RMS(grad u) 与 max(div u)/max(grad u)。
  divergence_relative_rms_max: 1.0e-4
  divergence_relative_max_max: 1.0e-3
  # W_full=W_resolved-Pi+S_bar 的全域相对 RMS 残差上限。
  energy_identity_relative_rms_max: 1.0e-4
  # 周期域净输运检查 |sum(S_bar)|/|sum(Pi)| 上限。
  s_bar_vs_pi_net_max: 1.0e-2
  # 六个 regime 重新合成全域统计时的相对 closure 上限。
  cq_partition_relative_max: 1.0e-12

physics:
  # 一个值或多个唯一正数。CLI 的 --sigma-grid/--sigma-grids 可临时覆盖。
  sigma_grid: [10, 15, 30, 55, 75]

  # gaussian 或 smooth_sharp。
  filter_type: smooth_sharp

  # smooth_sharp 的唯一边缘宽度参数：跨 sigma 固定 alpha=w/k_c。
  sharp_edge_width_fraction: 0.1171875

  # 仅永久保存中心滤波速度/梯度；生产实现固定要求 [256:768)^3。
  crop_start: [256, 256, 256]  # [x0, y0, z0]
  crop_shape: [512, 512, 512]  # [nx, ny, nz]

  # regime uncertain 阈值：epsilon=max(epsilon_abs, epsilon_rel*RMS(work))。
  epsilon_abs: 0.0
  epsilon_rel: 0.001

  # scipy FFT worker 数及按第一空间轴处理的 slab 宽度。
  fft_workers: 16
  fft_slab_width: 32

  # sigma 正式提交成功后删除其 run_root 工作区；输入缓存不删除。
  cleanup_scratch_on_success: true
